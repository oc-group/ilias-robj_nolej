name: ILIAS Plugin Code Quality

on:
  push:
    paths-ignore:
      - "README.md"
      - "docs/**"

jobs:
  test:
    name: Plugin Code Quality
    uses: oc-group/ilias-plugin-ci/.github/workflows/plugin-ci.yml@release_10
    secrets: inherit
    with:
      plugin_name: "Nolej"
      plugin_path: "public/Customizing/global/plugins/Services/Repository/RepositoryObject"
